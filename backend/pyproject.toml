[project]
name = "finite-backend"
version = "0.1.0"
description = "Finite API: news ingestion, finite briefings and source-grounded rabbit holes"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
